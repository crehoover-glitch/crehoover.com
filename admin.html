<main class="wrap">
<div id="gate"></div>
<div id="app" hidden>
  <h2>Waiting for approval</h2>
  <div id="pending" class="list"></div>
  <h2>Approved households</h2>
  <div id="approved" class="list"></div>
</div>

<footer><div class="wrap">
  <span>&copy; <span id="yr">2026</span> Cahaba River Estates HOA &middot; Hoover, Alabama</span>
  <span><a href="news.html">News</a> &middot; <a href="city.html">City Services</a> &middot; <a href="about.html">About</a> &middot; <a href="mailto:crehoover@gmail.com">crehoover@gmail.com</a></span>

<script>document.getElementById('yr').textContent=new Date().getFullYear()</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/cre.js"></script>
<script>
const {api,gate,esc,fmtDate,$}=CRE; let ME=null;
async function draw(){const ps=await api.list('profiles');
  const card=(p,act)=>`<article class="item"><h3>${esc(p.name)}</h3><p class="meta">${esc(p.street||'')} &middot; joined ${fmtDate(p.created_at,{month:'short',day:'numeric',year:'numeric'})}${p.is_admin?' &middot; <b>Board / editor</b>':''}</p><div class="actions">${act}</div></article>`;
  const pend=ps.filter(p=>!p.approved),ok=ps.filter(p=>p.approved).sort((a,b)=>a.name.localeCompare(b.name));
  $('#pending').innerHTML=pend.length?pend.map(p=>card(p,`<button class="btn small" data-ok="${p.id}">Approve</button><button class="btn gray small" data-no="${p.id}">Remove</button>`)).join(''):'<p class="empty">Nobody waiting.</p>';
  $('#approved').innerHTML=ok.map(p=>card(p,p.id==ME.id?'':`<button class="btn gray small" data-admin="${p.id}" data-v="${!p.is_admin}">${p.is_admin?'Remove board access':'Make board / editor'}</button><button class="link" data-no="${p.id}">Remove household</button>`)).join('')}
document.addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.ok){await api.edit('profiles',{id:b.dataset.ok},{approved:true});draw()}
  if(b.dataset.admin){await api.edit('profiles',{id:b.dataset.admin},{is_admin:b.dataset.v==='true'});draw()}
  if(b.dataset.no&&confirm('Remove this household? They can sign up again later.')){await api.remove('profiles',{id:b.dataset.no});draw()}});
document.addEventListener('DOMContentLoaded',()=>gate($('#gate'),me=>{if(!me.is_admin){$('#gate').insertAdjacentHTML('beforeend','<p>This page is for board members.</p>');return}ME=me;$('#app').hidden=false;draw()},'use board tools'));
</script>
</body>
</html>
