<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events | Cahaba River Estates</title>
<meta name="description" content="Potlucks, cookouts, and get-togethers. Tap once to RSVP.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305507f'/%3E%3Cpath d='M4 20c4-4 8 4 12 0s8 4 12 0' stroke='%235fd06f' stroke-width='3.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="banner">
  <header><div class="wrap">
    <a class="brand" href="index.html" aria-label="Cahaba River Estates home">
      <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#033a5c"/><path d="M8 25c5-5 9 4 14-1s9 4 14-1" stroke="#5fd06f" stroke-width="3.4" fill="none" stroke-linecap="round"/><path d="M8 31c5-4 9 3 14-1s9 3 14-1" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".8"/><path d="M22 20c0-6 3-9 6-10-1 4-3 7-6 10zM22 20c0-5-3-8-6-9 1 4 3 6 6 9z" fill="#5fd06f"/></svg>
      <span><b>Cahaba</b><small>RIVER ESTATES</small></span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html" aria-current="page">Events</a>
      <a href="help.html">Help Board</a>
      <a href="recommend.html">Recommend</a>
      <a href="care.html">Care</a>
      <a href="history.html">History</a>
    </nav>
  </div></header>
  <div class="wrap title">
    <h1>Neighborhood <span class="accent">Events</span></h1>
    <p>Potlucks, cookouts, and get-togethers. Tap once to RSVP.</p>
  </div>
  <svg class="wave" viewBox="0 0 1440 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 35 C240 70 480 0 720 35 S1200 70 1440 35 V70 H0Z" fill="#fff"/></svg>
</div>

<main class="wrap">
<div id="gate"></div>
<div id="list" class="list"></div>
<div id="add" hidden>
  <h2>Host an event</h2>
  <form class="box" id="evform">
    <label>What is it?<input name="title" required placeholder="Grill-out at our place"></label>
    <div class="row2">
      <label>Date<input type="date" name="date" required></label>
      <label>Start time<input type="time" name="time" required value="17:30"></label>
    </div>
    <label>Where?<input name="location" placeholder="Our backyard, 1234 Cahaba River Rd"></label>
    <label>Details<textarea name="details" placeholder="Bring a side dish. Kids welcome."></textarea></label>
    <label>How many people can come? (leave blank for no limit)<input type="number" name="cap" min="1" max="500" placeholder="12"></label>
    <button class="btn big" type="submit">Post event</button>
  </form>
</div>
</main>

<footer><div class="wrap">
  <span>&copy; <span id="yr">2026</span> Cahaba River Estates HOA &middot; Hoover, Alabama</span>
  <span><a href="news.html">News</a> &middot; <a href="city.html">City Services</a> &middot; <a href="about.html">About</a> &middot; <a href="mailto:crehoover@gmail.com">crehoover@gmail.com</a></span>
</div></footer>
<script>document.getElementById('yr').textContent=new Date().getFullYear()</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/cre.js"></script>
<script>
const {api,gate,names,esc,fmtDate,fmtTime,gcal,ics,$}=CRE; let ME=null;
function split(e,rs){const list=rs.filter(r=>r.event_id==e.id).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  let used=0;const going=[],wait=[];list.forEach(r=>{if(!wait.length&&(!e.cap||used+r.party<=e.cap)){going.push(r);used+=r.party}else wait.push(r)});return{going,wait,used,list}}
async function draw(){
  const [evs,rs,nm]=await Promise.all([api.list('events'),api.list('rsvps'),names()]);
  const up=evs.filter(e=>new Date(e.starts_at)>Date.now()-6*3600e3).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
  $('#list').innerHTML=up.length?up.map(e=>{const s=split(e,rs);const mine=s.list.find(r=>r.user_id==ME.id);
    const full=e.cap&&s.used>=e.cap; const left=e.cap?Math.max(0,e.cap-s.used):null;
    let act;
    if(mine){act=s.going.includes(mine)?`<p><b>You're going</b> (${mine.party} ${mine.party>1?'people':'person'}).</p>`:`<p><b>You're on the waitlist</b>, number ${s.wait.indexOf(mine)+1}. You'll move up automatically if someone cancels.</p>`;
      act+=`<div class="actions"><button class="btn gray small" data-cancel="${e.id}">I can't make it</button></div>`}
    else act=`<div class="actions"><label style="margin:0">How many?<select data-party="${e.id}" style="width:auto;display:inline-block;margin:0 0 0 8px">${[1,2,3,4,5,6].map(n=>`<option>${n}</option>`).join('')}</select></label>
      <button class="btn big" data-go="${e.id}">${full?'Join the waitlist':"I'm coming"}</button></div>`;
    const own=e.created_by==ME.id||ME.is_admin;
    return `<article class="item"><h3>${esc(e.title)}</h3>
      <p class="meta">${fmtDate(e.starts_at)} at ${fmtTime(e.starts_at)}${e.location?' &middot; '+esc(e.location):''}</p>
      ${e.details?`<p>${esc(e.details)}</p>`:''}
      ${e.cap?`<div class="spots"><i style="width:${Math.min(100,s.used/e.cap*100)}%"></i></div><p class="meta">${s.used} of ${e.cap} spots taken${left===0?' &middot; full':' &middot; '+left+' left'}${s.wait.length?' &middot; '+s.wait.length+' waiting':''}</p>`:`<p class="meta">${s.used} coming</p>`}
      ${s.going.length?`<p class="who-list">Coming: ${s.going.map(r=>esc(nm[r.user_id]||'Neighbor')+(r.party>1?' (+'+(r.party-1)+')':'')).join(', ')}</p>`:''}
      ${act}
      <div class="cal"><span>Add to my calendar:</span> <a href="${gcal(e)}" target="_blank" rel="noopener">Google</a> <a href="${ics(e)}" download="event.ics">iPhone / Outlook</a></div>${own?`<p style="margin:10px 0 0"><button class="link" data-del="${e.id}">Delete event</button></p>`:''}
    </article>`}).join(''):'<p class="empty">No events posted yet. Host one below.</p>';
}
document.addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.go){const p=+document.querySelector(`[data-party="${b.dataset.go}"]`).value;b.disabled=true;await api.add('rsvps',{event_id:+b.dataset.go,party:p}).catch(()=>alert('Could not RSVP. Try again.'));draw()}
  if(b.dataset.cancel){await api.remove('rsvps',{event_id:+b.dataset.cancel,user_id:ME.id});draw()}
  if(b.dataset.del&&confirm('Delete this event?')){await api.remove('events',{id:+b.dataset.del});draw()}});
$('#evform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
  const row={title:f.get('title'),starts_at:new Date(f.get('date')+'T'+f.get('time')).toISOString(),location:f.get('location'),details:f.get('details'),cap:f.get('cap')?+f.get('cap'):null};
  await api.add('events',row).catch(()=>alert('Could not post. Try again.'));e.target.reset();draw();scrollTo({top:0,behavior:'smooth'})};
document.addEventListener('DOMContentLoaded',()=>gate($('#gate'),me=>{ME=me;$('#add').hidden=false;draw()},'see events and RSVP'));
</script>
</body>
</html>
