<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help Board | Cahaba River Estates</title>
<meta name="description" content="Neighbors helping neighbors. Ask for a hand, or share a skill.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305507f'/%3E%3Cpath d='M4 20c4-4 8 4 12 0s8 4 12 0' stroke='%235fd06f' stroke-width='3.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="banner">
  <header><div class="wrap">
    <a class="brand" href="index.html" aria-label="Cahaba River Estates home">
      <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#033a5c"/><path d="M8 25c5-5 9 4 14-1s9 4 14-1" stroke="#5fd06f" stroke-width="3.4" fill="none" stroke-linecap="round"/><path d="M8 31c5-4 9 3 14-1s9 3 14-1" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".8"/><path d="M22 20c0-6 3-9 6-10-1 4-3 7-6 10zM22 20c0-5-3-8-6-9 1 4 3 6 6 9z" fill="#5fd06f"/></svg>
      <span><b>Cahaba</b><small>RIVER ESTATES</small></span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="help.html" aria-current="page">Help Board</a>
      <a href="recommend.html">Recommend</a>
      <a href="care.html">Care</a>
      <a href="history.html">History</a>
    </nav>
  </div></header>
  <div class="wrap title">
    <h1>Help <span class="accent">Board</span></h1>
    <p>Neighbors helping neighbors. Ask for a hand, or share a skill.</p>
  </div>
  <svg class="wave" viewBox="0 0 1440 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 35 C240 70 480 0 720 35 S1200 70 1440 35 V70 H0Z" fill="#fff"/></svg>
</div>

<main class="wrap">
<div id="gate"></div>
<div id="app" hidden>
  <div class="tabs">
    <button data-tab="need" aria-pressed="true">Neighbors who need help</button>
    <button data-tab="offer" aria-pressed="false">Skills neighbors offer</button>
  </div>
  <div id="list" class="list"></div>
  <h2>Post something</h2>
  <form class="box" id="hform">
    <div class="tabs" style="margin-bottom:18px">
      <button type="button" data-kind="need" aria-pressed="true">I need help</button>
      <button type="button" data-kind="offer" aria-pressed="false">I can help with a skill</button>
    </div>
    <label><span id="tlabel">What do you need?</span><input name="title" required placeholder="Ride to the airport Friday morning"></label>
    <label>Details (optional)<textarea name="details" placeholder="Anything that helps a neighbor decide"></textarea></label>
    <button class="btn big" type="submit">Post it</button>
  </form>
</div>
</main>

<footer><div class="wrap">
  <span>&copy; <span id="yr">2026</span> Cahaba River Estates HOA &middot; Hoover, Alabama</span>
  <span><a href="news.html">News</a> &middot; <a href="city.html">City Services</a> &middot; <a href="about.html">About</a> &middot; <a href="mailto:crehoover@gmail.com">crehoover@gmail.com</a></span>
</div></footer>
<script>document.getElementById('yr').textContent=new Date().getFullYear()</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/cre.js"></script>
<script>
const {api,gate,names,esc,fmtDate,$}=CRE; let ME=null, TAB=location.hash=='#offer'?'offer':'need', KIND=TAB;
async function draw(){
  const [ps,rs,nm]=await Promise.all([api.list('help_posts'),api.list('help_replies'),names()]);
  const list=ps.filter(p=>p.kind==TAB).sort((a,b)=>(a.status=='done')-(b.status=='done')||new Date(b.created_at)-new Date(a.created_at));
  $('#list').innerHTML=list.length?list.map(p=>{const rr=rs.filter(r=>r.post_id==p.id);const mine=rr.find(r=>r.user_id==ME.id);const own=p.created_by==ME.id;
    const verb=p.kind=='need'?'I can help':"I'd like this";
    let act='';
    if(p.status=='done')act='';
    else if(own)act=`<button class="btn gray small" data-done="${p.id}">Mark as taken care of</button>`;
    else if(mine)act=`<p><b>You offered.</b> ${esc(nm[p.created_by]||'Your neighbor')} will see your note.</p><button class="btn gray small" data-undo="${p.id}">Take back my offer</button>`;
    else act=`<div style="width:100%"><label style="margin:0 0 10px">Add a note (phone number, best time)<input data-note="${p.id}" placeholder="Call me at 205-555-0100"></label><button class="btn big" data-reply="${p.id}">${verb}</button></div>`;
    return `<article class="item"><span class="tag ${p.status=='done'?'done':p.kind}">${p.status=='done'?'Taken care of':p.kind=='need'?'Needs help':'Offering'}</span>
      <h3 style="margin-top:8px">${esc(p.title)}</h3><p class="meta">${esc(nm[p.created_by]||'Neighbor')} &middot; ${fmtDate(p.created_at,{month:'short',day:'numeric'})}</p>
      ${p.details?`<p>${esc(p.details)}</p>`:''}
      ${rr.length?(own||ME.is_admin?`<p class="who-list"><b>Responses:</b><br>${rr.map(r=>esc(nm[r.user_id]||'Neighbor')+(r.note?': '+esc(r.note):'')).join('<br>')}</p>`:`<p class="who-list">${rr.length} ${rr.length>1?'neighbors have':'neighbor has'} responded.</p>`):''}
      <div class="actions">${act}${own||ME.is_admin?` <button class="link" data-del="${p.id}">Delete</button>`:''}</div></article>`}).join(''):`<p class="empty">Nothing posted here yet.</p>`;
}
document.addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.tab){TAB=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',x==b));draw()}
  if(b.dataset.kind){KIND=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-pressed',x==b));$('#tlabel').textContent=KIND=='need'?'What do you need?':'What can you help with?'}
  if(b.dataset.reply){const n=document.querySelector(`[data-note="${b.dataset.reply}"]`).value;b.disabled=true;await api.add('help_replies',{post_id:+b.dataset.reply,note:n}).catch(()=>alert('Could not save. Try again.'));draw()}
  if(b.dataset.undo){await api.remove('help_replies',{post_id:+b.dataset.undo,user_id:ME.id});draw()}
  if(b.dataset.done){await api.edit('help_posts',{id:+b.dataset.done},{status:'done'});draw()}
  if(b.dataset.del&&confirm('Delete this post?')){await api.remove('help_posts',{id:+b.dataset.del});draw()}});
$('#hform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
  await api.add('help_posts',{kind:KIND,title:f.get('title'),details:f.get('details')}).catch(()=>alert('Could not post. Try again.'));
  e.target.reset();TAB=KIND;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tab==TAB));draw();scrollTo({top:0,behavior:'smooth'})};
document.addEventListener('DOMContentLoaded',()=>gate($('#gate'),me=>{ME=me;$('#app').hidden=false;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tab==TAB));document.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.kind==KIND));$('#tlabel').textContent=KIND=='need'?'What do you need?':'What can you help with?';draw()},'see and post help requests'));
</script>
</body>
</html>
